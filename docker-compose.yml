services:
  postgres:
    image: postgres:16-alpine
    container_name: klinekit-pg
    environment:
      POSTGRES_DB: klinekit
      POSTGRES_USER: klinekit
      POSTGRES_PASSWORD: klinekit
    ports:
      - "5432:5432"
    volumes:
      - klinekit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klinekit -d klinekit"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: klinekit-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/klinekit
      SPRING_DATASOURCE_USERNAME: klinekit
      SPRING_DATASOURCE_PASSWORD: klinekit
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Browser-side calls go to host-mapped 8080. Override at build time
        # (e.g. for a Fly.io deploy) with a public URL.
        NEXT_PUBLIC_KLINEKIT_API: ${KLINEKIT_API_PUBLIC:-http://localhost:8080/api/v1}
    container_name: klinekit-web
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  klinekit-pgdata:
