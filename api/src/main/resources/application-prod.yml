spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/klinekit}
    username: ${SPRING_DATASOURCE_USERNAME:klinekit}
    password: ${SPRING_DATASOURCE_PASSWORD:klinekit}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
