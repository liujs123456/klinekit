spring:
  application:
    name: klinekit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/klinekit}
    username: ${DB_USER:klinekit}
    password: ${DB_PASSWORD:klinekit}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.hibernate.SQL: WARN
    org.springframework.web: INFO
